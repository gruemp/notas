<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1020" />
  <title>Notas</title>

  <style>
    :root{
      --bg: #0b1020;
      --panel: rgba(17,26,51,.55);
      --panel2: rgba(17,26,51,.35);
      --text: #e8eeff;
      --muted: #a7b3dd;
      --line: rgba(255,255,255,.10);

      --fluor-blue:  #4F46E5;
      --fluor-blue2: #818CF8;

      --fluor-orange:  #F59E0B;
      --fluor-orange2: #FBBF24;

      --danger:  #EF4444;
      --danger2: #F87171;

      --ok:  #10B981;
      --ok2: #34D399;

      --btn:  #1F2A44;
      --btn2: #2B3A5E;

      --mark: rgba(255, 210, 0, .24);

      /* ✅ tamaños */
      --row-h: 44px;
      --btn-fixed-width: 44px;
      --btn-icon: 20px;

      /* ✅ categorías: color único */
      --cat-blue: #4F46E5;

      --radius: 12px;
    }

    [data-theme="light"]{
      --bg: #f7f8fc;
      --panel: rgba(255,255,255,.75);
      --panel2: rgba(255,255,255,.55);
      --text: #101428;
      --muted: #4a587e;
      --line: rgba(16,20,40,.12);

      --btn: #e7ebff;
      --btn2:#f2f4ff;

      --mark: rgba(255, 200, 0, .22);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(21,34,74,.9) 0%, var(--bg) 55%, rgba(7,10,20,.95) 100%);
    }

    [data-theme="light"] body{
      background: radial-gradient(1200px 600px at 20% 0%, rgba(140,165,255,.35) 0%, var(--bg) 55%, rgba(255,255,255,.9) 100%);
    }

    /* ✅ evita selección durante drag táctil */
    body.dragging-no-select, body.dragging-no-select *{
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    .app{
      max-width: 1080px;
      margin: 18px auto;
      padding: 14px;
    }

    /* ✅ Header fijo en móvil + sin scroll horizontal */
    .header{
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 60;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(11,16,32,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    [data-theme="light"] .header{
      background: rgba(247,248,252,.82);
    }

    /* ✅ Barra superior: PC en UNA FILA (sin overflow) */
    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:nowrap;       /* ✅ PC: 1 fila */
      overflow: hidden;       /* ✅ sin barra horizontal */
    }

    .searchbox{
      display:flex;
      align-items:stretch;
      flex: 1 1 auto;
      min-width: 0;                 /* ✅ permite encoger sin overflow */
      height: var(--row-h);
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      overflow:hidden;
    }
    [data-theme="light"] .searchbox{ background: rgba(255,255,255,.8); }

    .searchbox input{
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: none;
      outline:none;
      background: transparent;
      color: var(--text);
    }

    .searchbox:focus-within{
      border-color: rgba(0,183,255,.55);
      box-shadow: 0 0 0 3px rgba(0,183,255,.18);
    }

    /* ✅ Botón limpiar: mismo tamaño que los demás */
    .icon-btn{
      width: var(--btn-fixed-width);
      min-width: var(--btn-fixed-width);
      height: 100%;
      border: none;
      cursor:pointer;
      background: rgba(0,0,0,.10);
      border-left: 1px solid var(--line);
      color: var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 0;
    }
    [data-theme="light"] .icon-btn{ background: rgba(255,255,255,.55); }
    .icon-btn:hover{ filter: brightness(1.08); }

    .icon-btn svg{
      width: var(--btn-icon);
      height: var(--btn-icon);
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ✅ Botones base (cuadrados) */
    .btn{
      width: var(--btn-fixed-width);
      min-width: var(--btn-fixed-width);
      height: var(--row-h);
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, var(--btn2), var(--btn));
      color: var(--text);
      padding: 0;
      border-radius: 10px;
      cursor:pointer;
      user-select:none;
      transition: transform .05s ease, filter .15s ease, box-shadow .15s ease, border-color .15s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{ filter: brightness(1.08); }

    .btn svg{
      width: var(--btn-icon);
      height: var(--btn-icon);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .btn-add{
      border-color: rgba(129,140,248,.85);
      background: linear-gradient(180deg, var(--fluor-blue2), var(--fluor-blue));
      color: #ffffff;
      box-shadow: 0 0 18px rgba(79,70,229,.22);
    }

    .btn-copy{
      border-color: rgba(16,185,129,.70);
      background: linear-gradient(180deg, var(--ok2), var(--ok));
      color: #052014;
      box-shadow: 0 0 16px rgba(16,185,129,.20);
    }

    .btn-paste{
      border-color: rgba(245,158,11,.80);
      background: linear-gradient(180deg, var(--fluor-orange2), var(--fluor-orange));
      color: #1a1200;
      box-shadow: 0 0 18px rgba(245,158,11,.20);
    }

    .btn-danger{
      border-color: rgba(239,68,68,.75);
      background: linear-gradient(180deg, var(--danger2), var(--danger));
      color: #ffffff;
      box-shadow: 0 0 16px rgba(239,68,68,.20);
    }

    .btn-ghost{
      background: rgba(0,0,0,.12);
      border-color: rgba(255,255,255,.14);
      box-shadow: none;
    }
    [data-theme="light"] .btn-ghost{ background: rgba(255,255,255,.55); }

    /* ✅ Select como control cuadrado con icono (sin texto visible) */
    .selectwrap{
      position: relative;
      width: var(--btn-fixed-width);
      min-width: var(--btn-fixed-width);
      height: var(--row-h);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, var(--btn2), var(--btn));
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex: 0 0 auto;
    }
    [data-theme="light"] .selectwrap{ border-color: rgba(16,20,40,.14); }

    .selectwrap svg{
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: var(--text);
      opacity: .95;
      pointer-events:none;
    }

    .selectwrap select{
      position:absolute;      /* ✅ captura clic/tap */
      inset:0;
      width:100%;
      height:100%;
      opacity:0;              /* ✅ oculto, pero funcional */
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
      border:none;
      outline:none;
      background: transparent;
    }

    .selectwrap:focus-within{
      border-color: rgba(0,183,255,.55);
      box-shadow: 0 0 0 3px rgba(0,183,255,.18);
    }

    /* ✅ Controles bajo búsqueda: UNA sola fila (desktop y móvil) */
    .toolbar2{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:nowrap;   /* ✅ 1 fila */
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;   /* ✅ sin scroll horizontal */
    }

    .list{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow:hidden;
    }

    .section{ border-top: 1px solid var(--line); }
    .section:first-child{ border-top:none; }

    /* ✅ Secciones colapsables */
    .section.collapsed .section-body{ display:none; }

    .section-title{
      padding: 10px 12px;
      font-weight: 800;
      letter-spacing:.2px;
      color: var(--muted);
      background: var(--panel2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .section-title.section-toggle{
      cursor:pointer;
      user-select:none;
    }
    .section-title.section-toggle:focus{
      outline:none;
      box-shadow: 0 0 0 3px rgba(0,183,255,.18);
    }

    .section-title-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .section-count{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 28px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      flex: 0 0 auto;
    }
    [data-theme="light"] .section-count{ background: rgba(255,255,255,.6); }

    .section-chevron{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 24px;
      height: 24px;
      opacity: .95;
      color: var(--muted);
      flex: 0 0 auto;
    }
    .section-title.section-toggle:hover .section-chevron{ color: var(--text); }
    .section-chevron svg{ width: 18px; height: 18px; }

    .section-body{
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* ✅ Categorías */
    .cat-group{
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow:hidden;
      background: rgba(0,0,0,.10);
    }
    [data-theme="light"] .cat-group{ background: rgba(255,255,255,.55); }

    .cat-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      background: var(--panel2);
    }

    .cat-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }

    .cat-toggle{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      color: var(--muted);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .cat-toggle:hover{ color: var(--text); }
    .cat-toggle svg{ width: 18px; height: 18px; }

    .cat-name{
      font-weight: 800;
      letter-spacing: .2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width: 0;
    }

    .cat-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(0,0,0,.12);
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 800;
    }

    .cat-dot{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      flex: 0 0 auto;
      background: var(--cat-blue);
    }
    [data-theme="light"] .cat-dot{ border-color: rgba(16,20,40,.18); }

    .cat-right{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
    }

    .cat-list{
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .cat-group.collapsed .cat-list{ display:none; }

    .cat-empty{
      padding: 10px 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(0,0,0,.10);
      font-size: 13px;
      text-align:center;
    }
    [data-theme="light"] .cat-empty{ background: rgba(255,255,255,.45); }

    /* ✅ Nota */
    .note{
      display:grid;
      grid-template-columns: 34px 1fr auto;
      gap: 10px;
      align-items:center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0,0,0,.12);
    }
    [data-theme="light"] .note{ background: rgba(255,255,255,.55); }
    .note[hidden]{ display:none; }

    .drag-handle{
      height: var(--row-h);
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      border-radius: 10px;
      cursor: grab;
      color: var(--muted);
      font-size: 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    .drag-handle:active{ cursor: grabbing; }
    .drag-handle:hover{ color: var(--text); }

    .note.dragging{
      opacity:.55;
      outline: 2px dashed rgba(0,183,255,.45);
      outline-offset: 2px;
    }

    .note.placeholder{
      background: transparent !important;
      border: 2px dashed rgba(0,183,255,.45) !important;
    }

    .note.dragging-touch{
      opacity: .92;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      pointer-events: none;
      transform: rotate(.2deg);
    }

    .content{ min-width: 0; }

    /* ✅ Vista (solo lectura en la lista). Edición: modal */
    .note-view{
      height: var(--row-h);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      cursor: pointer;
      line-height: 1.4;
      word-break: break-word;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display:flex;
      align-items:center;
    }
    [data-theme="light"] .note-view{ background: rgba(255,255,255,.75); }

    .note-view:focus{
      outline:none;
      border-color: rgba(0,255,153,.40);
      box-shadow: 0 0 0 3px rgba(0,255,153,.12);
    }

    .note-view .placeholder{ color: var(--muted); }

    mark{
      background: var(--mark);
      color: inherit;
      border-radius: 4px;
      padding: 0 .12em;
    }

    /* ✅ Acciones por nota: sin scroll horizontal */
    .actions{
      min-height: var(--row-h);
      display:flex;
      flex-direction:row;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:nowrap;
      overflow: hidden;
      max-width: none;
    }

    .btn-pin{
      border-color: rgba(129,140,248,.85);
      background: linear-gradient(180deg, rgba(129,140,248,.95), rgba(79,70,229,.95));
      color: #ffffff;
      box-shadow: 0 0 16px rgba(79,70,229,.18);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.16);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      max-width: min(860px, 92vw);
      display:flex;
      gap:10px;
      align-items:center;
    }
    [data-theme="light"] .toast{ background: rgba(20,25,40,.88); }

    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
      pointer-events:auto;
    }

    .toast .toast-btn{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 10px;
      cursor:pointer;
      font-weight: 650;
    }
    .toast .toast-btn:hover{ filter: brightness(1.08); }

    .empty{
      padding: 18px 14px;
      text-align:center;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    .empty-title{
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    /* ✅ Modales */
    dialog.modal{
      border: none;
      padding: 0;
      border-radius: 14px;
      width: min(820px, 92vw);
      color: var(--text);
      background: rgba(10,14,28,.92);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      overflow:hidden;
    }
    [data-theme="light"] dialog.modal{
      background: rgba(245,247,255,.96);
      color: var(--text);
    }
    dialog::backdrop{ background: rgba(0,0,0,.55); }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
    }
    .modal-title{ font-weight: 900; letter-spacing: .2px; }
    .modal-body{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    /* ✅ Modal categorías */
    .cat-table{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .cat-row{
      display:grid;
      grid-template-columns: 1fr 34px 34px 44px;
      gap:10px;
      align-items:center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0,0,0,.10);
    }
    [data-theme="light"] .cat-row{ background: rgba(255,255,255,.65); }

    .cat-row input[type="text"]{
      width: 100%;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.16);
      color: var(--text);
      outline:none;
    }
    [data-theme="light"] .cat-row input[type="text"]{ background: rgba(255,255,255,.9); }

    .mini-btn{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      color: var(--muted);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .mini-btn:hover{ color: var(--text); }
    .mini-btn[disabled]{ opacity:.35; cursor:not-allowed; }

    .cat-add{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding-top: 6px;
      border-top: 1px solid var(--line);
      margin-top: 4px;
    }
    .cat-add input[type="text"]{
      flex: 1 1 260px;
      min-width: 220px;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.16);
      color: var(--text);
      outline:none;
    }
    [data-theme="light"] .cat-add input[type="text"]{ background: rgba(255,255,255,.9); }

    /* ✅ Modal nota */
    .note-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.10);
      border-radius: 12px;
      padding: 10px 12px;
    }
    [data-theme="light"] .note-meta{
      background: rgba(255,255,255,.7);
    }

    .note-meta .meta-text{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .note-editor{
      width:100%;
      min-height: min(62vh, 560px);
      resize: vertical;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: .1px;
      white-space: pre-wrap;
    }
    [data-theme="light"] .note-editor{
      background: rgba(255,255,255,.85);
    }
    .note-editor:focus{
      border-color: rgba(0,255,153,.40);
      box-shadow: 0 0 0 3px rgba(0,255,153,.12);
    }

    /* ✅ MÓVIL: debajo del buscador, TODOS los controles en UNA sola línea */
    @media (max-width: 860px){
      :root{
        --btn-fixed-width: 32px;
        --btn-icon: 15px;
        --row-h: 38px;
      }

      .app{ margin: 12px auto; padding: 12px; }

      .topbar{
        flex-direction: column;
        align-items: stretch;
        flex-wrap: nowrap;
        overflow: visible;
      }

      .searchbox{ order: 1; }
      .toolbar2{
        order: 2;
        width: 100%;
        justify-content: center;
        gap: 6px;
        flex-wrap: nowrap;     /* ✅ 1 sola línea */
        overflow: hidden;      /* ✅ sin scroll horizontal */
      }

      .actions{
        flex-wrap:wrap;
        justify-content:flex-end;
      }

      .note-editor{
        min-height: min(66vh, 560px);
        font-size: 16px;
      }

      /* ✅ Meta en móvil: mostrar completa (sin recorte) */
      .note-meta{
        align-items:flex-start;
      }
      .note-meta .meta-text{
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        line-height: 1.25;
      }
    }

  <script>
    (() => {
      "use strict";

      /* =========================
         Backend: GitHub Pages -> Apps Script Web App API
         - Lee con JSONP (GET) para evitar CORS
         - Guarda con POST vía iframe + postMessage (evita CORS)
         - ✅ SIN TOKEN (abierto)
      ========================== */

      const API_URL = "https://script.google.com/macros/s/AKfycbyNE12DPGcX6w9zTQRjCAej-bxeQM4GDCpTrVhlERhj_cptdO7uFXlDJ4aDgt_230_V/exec";
      const AUTOSYNC_MS = 15000;

      function isLikelyBadApiUrl_(u) {
        const s = String(u || "");
        return !s || s.includes("XXXXXXXX") || s.includes("/macros/library/") || s.includes("/library/d/");
      }

      function jsonp_(params) {
        return new Promise((resolve, reject) => {
          if (isLikelyBadApiUrl_(API_URL)) {
            reject(new Error("Configura API_URL con tu /exec real (no /library)."));
            return;
          }

          const cb = "__jsonp_cb_" + Math.random().toString(16).slice(2);
          const url = new URL(API_URL);
          const q = new URLSearchParams(params || {});
          q.set("callback", cb);
          q.set("t", String(Date.now()));
          url.search = q.toString();

          let done = false;
          const cleanup = () => {
            if (done) return;
            done = true;
            try { delete window[cb]; } catch {}
            script.remove();
            clearTimeout(timer);
          };

          window[cb] = (data) => { cleanup(); resolve(data); };

          const script = document.createElement("script");
          script.src = url.toString();
          script.async = true;
          script.onerror = () => { cleanup(); reject(new Error("JSONP error (revisa API_URL/deploy)")); };

          const timer = setTimeout(() => {
            cleanup();
            reject(new Error("Timeout leyendo datos (revisa Apps Script)"));
          }, 12000);

          document.head.appendChild(script);
        });
      }

      async function apiGetState_() {
        const data = await jsonp_({ action: "getState" });
        if (data && data.ok === false) throw new Error(data.error || "Error getState");
        validateRemote_(data);
        return data;
      }

      // Guardado por POST via iframe (sin CORS)
      const SAVE_IFRAME_NAME = "notas_save_iframe_v2";
      let saveBridgeReady = false;
      let saveBusy = false;
      let saveQueuedState = null;
      let activeSavePromise = null;
      let saveRequestSeq = 0;

      let saveIframeEl = null;
      let saveFormEl = null;
      let inActionEl = null;
      let inPayloadEl = null;
      let inRequestIdEl = null;

      function ensureSaveBridge_() {
        if (saveBridgeReady) return;
        if (isLikelyBadApiUrl_(API_URL)) return;

        saveIframeEl = document.createElement("iframe");
        saveIframeEl.name = SAVE_IFRAME_NAME;
        saveIframeEl.style.position = "fixed";
        saveIframeEl.style.left = "-9999px";
        saveIframeEl.style.top = "-9999px";
        saveIframeEl.style.width = "1px";
        saveIframeEl.style.height = "1px";
        saveIframeEl.setAttribute("aria-hidden", "true");

        saveFormEl = document.createElement("form");
        saveFormEl.method = "POST";
        saveFormEl.action = API_URL;
        saveFormEl.target = SAVE_IFRAME_NAME;
        saveFormEl.acceptCharset = "utf-8";
        saveFormEl.style.position = "fixed";
        saveFormEl.style.left = "-9999px";
        saveFormEl.style.top = "-9999px";

        inActionEl = document.createElement("input");
        inActionEl.type = "hidden";
        inActionEl.name = "action";
        inActionEl.value = "saveAll";

        inPayloadEl = document.createElement("input");
        inPayloadEl.type = "hidden";
        inPayloadEl.name = "payload";

        inRequestIdEl = document.createElement("input");
        inRequestIdEl.type = "hidden";
        inRequestIdEl.name = "requestId";
        saveFormEl.appendChild(inRequestIdEl);
        saveFormEl.appendChild(inActionEl);
        saveFormEl.appendChild(inPayloadEl);

        document.body.appendChild(saveIframeEl);
        document.body.appendChild(saveFormEl);

        saveBridgeReady = true;
      }

      function apiSaveAll_(state) {
        if (isLikelyBadApiUrl_(API_URL)) return Promise.reject(new Error("API_URL inválida"));
        ensureSaveBridge_();
        if (!saveBridgeReady) return Promise.reject(new Error("No se inicializó el puente de guardado"));
        // Se preserva la versión más reciente y se evita superponer dos POST.
        saveQueuedState = JSON.stringify(state);
        if (saveBusy) return activeSavePromise;
        saveBusy = true;
        activeSavePromise = (async () => {
          while (saveQueuedState !== null) {
            const payload = saveQueuedState;
            saveQueuedState = null;
            const requestId = 'save_' + makeId() + '_' + (++saveRequestSeq);
            await new Promise((resolve, reject) => {
              let done = false;
              let timer;
              const complete = (error) => {
                if (done) return;
                done = true;
                window.removeEventListener('message', onMessage);
                clearTimeout(timer);
                if (error) reject(error);
                else resolve();
              };
              const onMessage = (ev) => {
                const data = ev && ev.data;
                if (!data || data.type !== 'notas_saveAll') return;
                const trustedOrigin = /^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(ev.origin);
                if (!trustedOrigin || data.requestId !== requestId) return;
                if (data.ok && !data.revision) { complete(new Error('Actualiza el despliegue de Apps Script a v5')); return; }
                if (data.ok) state.savedRevision = data.revision;
                complete(data.ok ? null : new Error(data.error || 'Error guardando'));
              };
              window.addEventListener('message', onMessage);
              timer = setTimeout(() => complete(new Error('Guardado sin confirmación')), 12000);
              try {
                inRequestIdEl.value = requestId;
                inPayloadEl.value = payload;
                saveFormEl.submit();
              } catch (error) { complete(error); }
            });
          }
          return { ok: true };
        })().finally(() => {
          saveBusy = false;
          activeSavePromise = null;
        });
        return activeSavePromise;
      }

      /* =========================
         Storage (solo UI)
      ========================== */
      const THEME_KEY = "notas_web_theme_v1";
      const SETTINGS_KEY = "notas_web_settings_v1";
      const PENDING_KEY = "notas_web_pending_state_v1";
      const TAB_PENDING_KEY = PENDING_KEY + ":" + makeId();
      const PENDING_ACK_KEY = "notas_web_pending_ack_v1:";
      let stagedPendingKey = null;
      const CACHE_KEY = "notas_web_last_state_v1";
      const COLLAPSE_KEY = "notas_web_category_collapse_v1";

      /* =========================
         Model
      ========================== */
      const GENERAL_CATEGORY_ID = "general";
      const CATEGORY_COLOR = "#4F46E5";

      const DEFAULT_GENERAL_CATEGORY = {
        id: GENERAL_CATEGORY_ID,
        name: "General",
        color: CATEGORY_COLOR,
        order: 0,
        // ✅ estados separados: normal vs fijadas
        collapsedNormal: true,
        collapsedPinned: true
      };

      const DEFAULT_SETTINGS = {
        sortMode: "manual",
        theme: "auto",
        categoryFilter: "all",
        pinnedSectionCollapsed: false,
        notesSectionCollapsed: false
      };

      const Icons = {
        pin: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14 4h-4v5l-2 2v3h8v-3l-2-2z"></path>
            <path d="M12 14v7"></path>
          </svg>`,
        unpin: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14 4h-4v5l-2 2v3h8v-3l-2-2z"></path>
            <path d="M12 14v7"></path>
            <path d="M4 4l16 16"></path>
          </svg>`,
        copy: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="10" height="10" rx="2"></rect>
            <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"></path>
          </svg>`,
        paste: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 4h6"></path>
            <path d="M9 4a2 2 0 0 0-2 2v1h10V6a2 2 0 0 0-2-2"></path>
            <path d="M7 7h10v15H7z"></path>
          </svg>`,
        clear: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 20H8"></path>
            <path d="M6 14l8-8 4 4-8 8H6z"></path>
            <path d="M14 6l4 4"></path>
          </svg>`,
        trash: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 16H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>`,
        chevronDown: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 9l6 6 6-6"></path>
          </svg>`,
        chevronRight: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 6l6 6-6 6"></path>
          </svg>`,
        plus: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>`,
        tag: `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 13l-7 7-10-10V3h7z"></path>
            <path d="M7 7h.01"></path>
          </svg>`
      };

      const $ = (id) => document.getElementById(id);

      const searchEl = $("search");
      const clearSearchEl = $("clearSearch");
      const sortEl = $("sort");
      const catFilterEl = $("catFilter");
      const newCatTopEl = $("newCatTop");

      const catBtnEl = $("catBtn");
      const newNoteEl = $("newNote");
      const exportJsonEl = $("exportJson");
      const exportTxtEl = $("exportTxt");
      const importBtnEl = $("importBtn");
      const importFileEl = $("importFile");
      const themeBtnEl = $("themeBtn");

      const pinnedSectionEl = $("pinnedSection");
      const pinnedTitleEl = $("pinnedTitle");
      const pinnedChevronEl = $("pinnedChevron");
      const pinnedListEl = $("pinnedList");
      const pinnedCountEl = $("pinnedCount");

      const notesSectionEl = $("notesSection");
      const notesTitleEl = $("notesTitle");
      const notesChevronEl = $("notesChevron");
      const notesListEl = $("notesList");
      const notesCountEl = $("notesCount");

      const emptyEl = $("empty");
      const toastEl = $("toast");

      const catDialogEl = $("catDialog");
      const catCloseEl = $("catClose");
      const catTableEl = $("catTable");
      const catNewNameEl = $("catNewName");
      const catAddBtnEl = $("catAddBtn");

      const noteDialogEl = $("noteDialog");
      const noteCloseEl = $("noteClose");
      const noteMetaEl = $("noteMeta");
      const noteEditorEl = $("noteEditor");
      const noteInsertDateEl = $("noteInsertDate");

      let notes = [];
      let categories = [];
      let settings = { ...DEFAULT_SETTINGS };
      let undoState = null;

      /* Drag state */
      let dragId = null;
      let dragCtx = null;

      /* ✅ drag táctil */
      let pendingPress = null;
      let pointerDrag = null;
      const isCoarsePointer = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      const supportsPointer = "PointerEvent" in window;

      /* Auto-sync snapshot */
      let lastSnapshot = "";

      /* Modal nota */
      let activeNoteId = null;
      const refreshPreviewDebounced = debounce(() => applySearchAndHighlights(), 80);

      document.addEventListener("DOMContentLoaded", () => { init(); });

      async function init() {
        try {
          const pendingEntries = readPending_();
          const restoring = pendingEntries.length > 0;
          const cached = safeParse(safeStorageGet_(CACHE_KEY), null);
          let record = null;
          try { record = await readLocalRecord_(); } catch (error) { console.warn("Almacén local no disponible:", error); }
          const initial = record?.state || cached || emptyState_();
          validateRemote_(initial);
          localBaseState = cloneState_(initial);
          baseState = record ? record.cloudBase : (cached?.localOnly ? cached.cloudBase : cached);
          let recovered = cloneState_(initial);
          for (const entry of pendingEntries) {
            const value = entry.value.state || entry.value;
            try {
              validateRemote_(value);
              // Sin una base verificable solo se incorporan datos; nunca se infieren borrados.
              recovered = mergeLocalStates_(entry.value.base || emptyState_(), value, recovered);
              adoptedPending.set(entry.key, entry.raw);
              if (!baseState && entry.value.cloudBase) baseState = cloneState_(entry.value.cloudBase);
            } catch (error) {
              console.warn("Respaldo pendiente conservado:", error);
              toast("Hay un respaldo que necesita revisión; se conserva para exportarlo", 5000);
            }
          }
          notes = recovered.notes;
          categories = recovered.categories;


          const localSettings = safeParse(safeStorageGet_(SETTINGS_KEY), {}) || {};
          settings = { ...DEFAULT_SETTINGS, ...(initial?.settings || {}), ...localSettings };

          const savedTheme = safeStorageGet_(THEME_KEY);
          if (savedTheme && ["auto","dark","light"].includes(savedTheme)) settings.theme = savedTheme;

          ensureGeneralCategory();
          sanitizeNotesCategoryIds();

          applyTheme(settings.theme);
          sortEl.value = settings.sortMode;

          bindEvents();

          renderCategoryFilter();
          syncTopSelectTitles_();
          renderAll();

          if (restoring || !record) {
            localRevision++;
            stagePending_();
            await flushPendingSave_();
          }

          lastSnapshot = makeSnapshot_(categories, notes);
          startAutoSync();
          initLocalNotifications_();

      function syncTopSelectTitles_() {
        try {

      function saveUISettings_() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            sortMode: settings.sortMode,
            categoryFilter: settings.categoryFilter,

      function safeParse(json, fallback) { try { return JSON.parse(json); } catch { return fallback; } }
      function makeId() { return (window.crypto?.randomUUID) ? crypto.randomUUID() : String(Date.now()) + "_" + Math.random().toString(16).slice(2); }

      function norm(s) {
        return (s ?? "")
          .toString()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function escapeHTML(s) {
        return (s ?? "").toString().replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
      }

      function debounce(fn, ms) {
        let t = 0;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
      }

      function buildNormMap(str) {
        let normStr = "";
        const map = [];
        for (let i = 0; i < str.length; i++) {
          const ch = str[i];
          const n = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
          for (let j = 0; j < n.length; j++) {
            normStr += n[j];
            map.push(i);
          }
        }
        return { normStr, map };
      }

      function makeHighlightedHTML(text, terms, preview = false) {
        if (!text) return `<span class="placeholder">Toca para editar…</span>`;

        const cleanTerms = (terms || []).filter(Boolean);
        const baseText = preview
          ? (text ?? "").toString().replace(/\r/g, "").replace(/\n+/g, " ").replace(/\s+/g, " ").trim()
          : (text ?? "").toString();

        if (!cleanTerms.length) {
          const escaped = escapeHTML(baseText);
          return preview ? escaped : escaped.replace(/\n/g, "<br>");
        }

        const { normStr, map } = buildNormMap(baseText);
        const ranges = [];

        for (const term of cleanTerms) {
          let start = 0;
          while (true) {
            const idx = normStr.indexOf(term, start);
            if (idx === -1) break;
            ranges.push([idx, idx + term.length]);
            start = idx + term.length;
          }
        }

        if (!ranges.length) {
          const escaped = escapeHTML(baseText);
          return preview ? escaped : escaped.replace(/\n/g, "<br>");
        }

        ranges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

        const merged = [];
        for (const r of ranges) {
          if (!merged.length || r[0] > merged[merged.length - 1][1]) merged.push(r.slice());
          else merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
        }

        const origRanges = merged.map(([a, b]) => {
          const startOrig = map[a] ?? 0;
          const endOrig = (map[b - 1] ?? (baseText.length - 1)) + 1;
          return [startOrig, endOrig];
        });

        origRanges.sort((a, b) => a[0] - b[0]);
        const final = [];
        for (const r of origRanges) {
          if (!final.length || r[0] > final[final.length - 1][1]) final.push(r.slice());
          else final[final.length - 1][1] = Math.max(final[final.length - 1][1], r[1]);
        }

        let out = "";
        let last = 0;
        for (const [s, e] of final) {
          out += escapeHTML(baseText.slice(last, s));
          out += `<mark>${escapeHTML(baseText.slice(s, e))}</mark>`;
          last = e;
        }
        out += escapeHTML(baseText.slice(last));
        return preview ? out : out.replace(/\n/g, "<br>");
      }

      function cssEscape(s) {
        if (window.CSS && typeof CSS.escape === "function") return CSS.escape(s);
        return String(s).replace(/["\\]/g, "\\$&");
      }

      function pad2_(n){ return String(n).padStart(2,"0"); }

      /* ✅ Formatos fecha */
      function formatDateTime_(ms) {
        const d = new Date(ms);
        return `${d.getFullYear()}-${pad2_(d.getMonth()+1)}-${pad2_(d.getDate())} ${pad2_(d.getHours())}-${pad2_(d.getMinutes())}`;
      }
      function formatDate_(ms){
        const d = new Date(ms);
        return `${d.getFullYear()}-${pad2_(d.getMonth()+1)}-${pad2_(d.getDate())}`;
      }

      function insertAtCursor_(ta, text) {
        try {
          const start = ta.selectionStart ?? ta.value.length;
          const end = ta.selectionEnd ?? ta.value.length;
          const v = ta.value ?? "";
          ta.value = v.slice(0, start) + text + v.slice(end);
          const pos = start + text.length;
          ta.selectionStart = ta.selectionEnd = pos;
          ta.focus();
        } catch {
          ta.value = (ta.value || "") + text;
          ta.focus();
        }
      }

      function applySectionCollapseUI_(){
        try{
          pinnedSectionEl?.classList.toggle("collapsed", !!settings.pinnedSectionCollapsed);
          notesSectionEl?.classList.toggle("collapsed", !!settings.notesSectionCollapsed);

          if (pinnedChevronEl) pinnedChevronEl.innerHTML = settings.pinnedSectionCollapsed ? Icons.chevronRight : Icons.chevronDown;
          if (notesChevronEl) notesChevronEl.innerHTML = settings.notesSectionCollapsed ? Icons.chevronRight : Icons.chevronDown;

          pinnedTitleEl?.setAttribute("aria-expanded", String(!settings.pinnedSectionCollapsed));
          notesTitleEl?.setAttribute("aria-expanded", String(!settings.notesSectionCollapsed));
        } catch {}
      }

      /* =========================
         Categories
      ========================== */
      function ensureGeneralCategory() {
        if (!categories || !Array.isArray(categories)) categories = [];
        const hasGeneral = categories.some(c => String(c.id) === GENERAL_CATEGORY_ID);
        if (!hasGeneral) categories.unshift({ ...DEFAULT_GENERAL_CATEGORY });

        const localCollapse = safeParse(safeStorageGet_(COLLAPSE_KEY), {}) || {};
        categories.forEach((c, i) => {
          if (!c || typeof c !== "object") return;
          c.id = String(c.id ?? makeId());
          c.name = String(c.name ?? "Categoría");
          c.color = CATEGORY_COLOR;
          c.order = Number.isFinite(Number(c.order)) ? Number(c.order) : i * 1000;

          // ✅ compatibilidad con datos antiguos:
          // - antes existía solo `collapsed`
          if (typeof c.collapsedNormal !== "boolean") c.collapsedNormal = Boolean(c.collapsed ?? true);
          if (typeof c.collapsedPinned !== "boolean") c.collapsedPinned = c.collapsedPinned === "" ? true : Boolean(c.collapsedPinned ?? true);
          if (localCollapse[c.id]) {
            c.collapsedNormal = !!localCollapse[c.id].normal;
            c.collapsedPinned = !!localCollapse[c.id].pinned;
          }
          // mantener `collapsed` como espejo (por si lo usas en otro lado)
          c.collapsed = c.collapsedNormal;
        });

        const general = categories.find(c => c.id === GENERAL_CATEGORY_ID);
        if (general) {
          general.order = Math.min(general.order, -100000);
          general.color = CATEGORY_COLOR;
          if (typeof general.collapsedNormal !== "boolean") general.collapsedNormal = true;
          if (typeof general.collapsedPinned !== "boolean") general.collapsedPinned = true;
          general.collapsed = general.collapsedNormal;
        }

        categories = sortCategories(categories);
      }

      function saveCategoryCollapse_() {
        const state = {};
        categories.forEach(c => {
          if (c && c.id) state[c.id] = { normal: !!c.collapsedNormal, pinned: !!c.collapsedPinned };
        });
        try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state)); } catch {}
      }

      function sortCategories(list) {
        return (list || []).slice().sort((a, b) => {
          const ao = Number(a.order ?? 0), bo = Number(b.order ?? 0);
          if (ao !== bo) return ao - bo;
          return String(a.name || "").localeCompare(String(b.name || ""), "es", { sensitivity: "base" });
        });
      }

      function getCategoryById(id) {
        return categories.find(c => c.id === id) || null;
      }

      function sanitizeNotesCategoryIds() {
        const ids = new Set(categories.map(c => c.id));
        for (const n of notes) {
          if (!n.categoryId || !ids.has(n.categoryId)) n.categoryId = GENERAL_CATEGORY_ID;
        }
      }

      function renderCategoryFilter() {
        const current = settings.categoryFilter || "all";
        catFilterEl.innerHTML = "";

        const optAll = document.createElement("option");
        optAll.value = "all";
        optAll.textContent = "Todas";
        catFilterEl.appendChild(optAll);

        const sorted = sortCategories(categories);
        for (const c of sorted) {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.name;
          catFilterEl.appendChild(opt);
        }

        if (current !== "all" && !getCategoryById(current)) settings.categoryFilter = "all";
        catFilterEl.value = settings.categoryFilter || "all";
        syncTopSelectTitles_();
      }

      function openCatDialog({ focusNew } = {}) {
        renderCatManager();
        if (typeof catDialogEl.showModal === "function") catDialogEl.showModal();
        else catDialogEl.setAttribute("open", "open");

        if (focusNew) setTimeout(() => catNewNameEl.focus(), 0);
      }

      function closeCatDialog() {
        if (typeof catDialogEl.close === "function") catDialogEl.close();
        else catDialogEl.removeAttribute("open");
        if (renderPending) { renderPending = false; renderAll(); }
        refreshLocalState_();
      }

      function renderCatManager() {
        ensureGeneralCategory();
        categories = sortCategories(categories);
        catTableEl.innerHTML = "";

        for (let i = 0; i < categories.length; i++) {
          const c = categories[i];
          const row = document.createElement("div");
          row.className = "cat-row";
          row.dataset.catId = c.id;

          const name = document.createElement("input");
          name.type = "text";
          name.value = c.name;
          name.placeholder = "Nombre";
          name.setAttribute("aria-label", "Nombre de categoría");
          name.disabled = (c.id === GENERAL_CATEGORY_ID);

          const up = document.createElement("button");
          up.className = "mini-btn";
          up.type = "button";
          up.innerHTML = "↑";
          up.title = "Subir";
          up.setAttribute("aria-label", "Subir");
          up.disabled = (i === 0);

          const down = document.createElement("button");
          down.className = "mini-btn";
          down.type = "button";
          down.innerHTML = "↓";
          down.title = "Bajar";
          down.setAttribute("aria-label", "Bajar");
          down.disabled = (i === categories.length - 1);

          const del = document.createElement("button");
          del.className = "btn btn-danger";
          del.type = "button";
          del.title = "Eliminar";
          del.setAttribute("aria-label", "Eliminar");
          del.innerHTML = `${Icons.trash}<span class="sr-only">Eliminar</span>`;
          del.disabled = (c.id === GENERAL_CATEGORY_ID);

          name.addEventListener("input", () => {
            c.name = name.value.trim() || c.name;
            saveDebounced();
            renderCategoryFilter();
            renderAllDebounced();
          });

          up.addEventListener("click", () => {
            swapCategoryOrder(i, i - 1);
            toast("Categoría movida");
          });

          down.addEventListener("click", () => {
            swapCategoryOrder(i, i + 1);
            toast("Categoría movida");
          });

          del.addEventListener("click", () => {
            if (!confirm(`¿Eliminar la categoría "${c.name}"?\nLas notas pasarán a "General".`)) return;
            deleteCategory(c.id);
          });

          row.appendChild(name);
          row.appendChild(up);
          row.appendChild(down);
          row.appendChild(del);

          catTableEl.appendChild(row);
        }
      }

      const renderAllDebounced = debounce(() => renderAll(), 120);

      function swapCategoryOrder(i, j) {
        categories = sortCategories(categories);
        if (j < 0 || j >= categories.length) return;
        const a = categories[i], b = categories[j];
        const tmp = a.order;
        a.order = b.order;
        b.order = tmp;

        renormalizeCategoryOrders();
        categories = sortCategories(categories);
        saveDebounced();
        renderCategoryFilter();
        renderCatManager();
        renderAll();
      }

      function renormalizeCategoryOrders() {
        categories = sortCategories(categories);
        for (let i = 0; i < categories.length; i++) {
          categories[i].order = i * 1000;
          categories[i].color = CATEGORY_COLOR;
        }
        const general = categories.find(c => c.id === GENERAL_CATEGORY_ID);
        if (general) general.order = -100000;
      }

      function deleteCategory(catId) {
        if (catId === GENERAL_CATEGORY_ID) return;

        for (const n of notes) {
          if (n.categoryId === catId) {
            n.categoryId = GENERAL_CATEGORY_ID;
            if (settings.sortMode === "manual") {
              n.order = lastOrder(n.pinned, GENERAL_CATEGORY_ID) + 1000;
            }
            n.updatedAt = Date.now();
          }
        }

        categories = categories.filter(c => c.id !== catId);
        ensureGeneralCategory();

        if (settings.sortMode === "manual") {
          renormalizeOrders(true, GENERAL_CATEGORY_ID);
          renormalizeOrders(false, GENERAL_CATEGORY_ID);
        }

        if (settings.categoryFilter === catId) settings.categoryFilter = "all";

        saveDebounced();
        renderCategoryFilter();
        renderCatManager();
        renderAll();
        toast("Categoría eliminada");
      }

      function addCategoryFromForm() {
        const name = (catNewNameEl.value || "").trim();
        if (!name) { toast("Escribe un nombre"); catNewNameEl.focus(); return; }

        const exists = categories.find(c => norm(c.name) === norm(name));
        if (exists) {
          toast("Ya existe una categoría con ese nombre");
          catNewNameEl.select();
          return;
        }

        const maxOrder = categories.reduce((m, c) => Math.max(m, Number(c.order ?? 0)), 0);
        const c = {
          id: makeId(),
          name,
          color: CATEGORY_COLOR,
          order: maxOrder + 1000,
          collapsedNormal: true,
          collapsedPinned: true,
          collapsed: true
        };
        categories.push(c);
        ensureGeneralCategory();

        catNewNameEl.value = "";

        saveDebounced();
        renderCategoryFilter();
        renderCatManager();
        renderAll();
        toast("Categoría creada");
      }

      /* =========================
         Serialize + Save
      ========================== */
      function serializeState() {
        return {
          v: 5,
          savedAt: Date.now(),
          notes,
          categories,
          settings: {
            sortMode: settings.sortMode,
            theme: settings.theme,
            categoryFilter: settings.categoryFilter,
            pinnedSectionCollapsed: !!settings.pinnedSectionCollapsed,
            notesSectionCollapsed: !!settings.notesSectionCollapsed
          }
        };
      }

      let localRevision = 0;
      let confirmedRevision = 0;
      let baseState = null;
      let flushPromise = null;
      let renderPending = false;
      let localBaseState = null;
      let localSavedRevision = 0;
      let localSavePromise = null;
      let localDatabasePromise = null;
      let localChannel = null;
      let cloudNoticeShown = false;
      const adoptedPending = new Map();

      function cloneState_(state) { return JSON.parse(JSON.stringify(state)); }
      function validateRemote_(data) {
        if (!data || data.ok === false || !Array.isArray(data.notes) || !Array.isArray(data.categories)) throw new Error("Respuesta de datos inválida");
        for (const key of ["notes", "categories"]) {
          const ids = new Set();
          for (const item of data[key]) {
            if (!item || typeof item !== "object" || typeof item.id !== "string" || !item.id || ids.has(item.id)) throw new Error("Datos con ID inválido o duplicado");
            ids.add(item.id);
            if (key === "notes" && typeof item.text !== "string") throw new Error("Texto inválido");
            if (key === "categories") {
              const bool = v => v === true || v === "true" || v === 1;
              item.collapsedNormal = item.collapsedNormal == null ? (item.collapsed === "" || item.collapsed == null ? true : bool(item.collapsed)) : bool(item.collapsedNormal);
              item.collapsedPinned = item.collapsedPinned === "" || item.collapsedPinned == null ? true : bool(item.collapsedPinned);
              item.collapsed = item.collapsedNormal;
            }
          }
        }
      }
      function readPending_() {
        const entries = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key !== PENDING_KEY && !key?.startsWith(PENDING_KEY + ":")) continue;
            const raw = localStorage.getItem(key);
            if (safeStorageGet_(PENDING_ACK_KEY + key) === raw) continue;
            const value = safeParse(raw, null);
            const state = value?.state || value;
            if (Array.isArray(state?.notes) && Array.isArray(state?.categories)) entries.push({key, raw, value});
          }
        } catch {}
        return entries;
      }
      function mergeStates_(base, local, remote) {
        const output = cloneState_(remote);
        const stable = value => value && typeof value === "object"
          ? JSON.stringify(Object.keys(value).sort().map(k => [k, value[k]])) : JSON.stringify(value);
        const equal = (a, b) => stable(a) === stable(b);
        for (const key of ["categories", "notes"]) {
          const before = new Map((base?.[key] || []).map(x => [x.id, x]));
          const ours = new Map(local[key].map(x => [x.id, x]));
          const theirs = new Map(remote[key].map(x => [x.id, x]));
          for (const id of new Set([...before.keys(), ...ours.keys()])) {
            const b = before.get(id), l = ours.get(id), r = theirs.get(id);
            if (equal(b, l)) continue;
            if (equal(b, r) || equal(l, r)) { if (l) theirs.set(id, l); else theirs.delete(id); continue; }
            if (!b || !l || !r) throw new Error("Conflicto al eliminar o crear " + key);
            const merged = {...r};
            for (const field of new Set([...Object.keys(b), ...Object.keys(l)])) {
              if (equal(b[field], l[field])) continue;
              if (!equal(b[field], r[field]) && !equal(l[field], r[field]) && field !== "updatedAt") throw new Error("Conflicto en " + key + ": " + field);
              merged[field] = field === "updatedAt" ? Math.max(l[field] || 0, r[field] || 0) : l[field];
            }
            theirs.set(id, merged);
          }
          output[key] = [...theirs.values()];
        }
        const ids = new Set(output.categories.map(c => c.id));
        if (output.notes.some(n => !ids.has(n.categoryId))) throw new Error("Conflicto en categorías");
        return output;
      }

      function safeStorageGet_(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      }

      function stagePending_() {
        try {
          // Cada versión tiene clave propia: nadie puede reemplazarla entre leerla y borrarla.
          const journalId = makeId();
          const nextKey = TAB_PENDING_KEY + ":snapshot:" + journalId;
          localStorage.setItem(nextKey, JSON.stringify({journalId, state: serializeState(), base: localBaseState || baseState, cloudBase: baseState}));
          const previousKey = stagedPendingKey;
          stagedPendingKey = nextKey;
          if (previousKey) localStorage.removeItem(previousKey);
          return true;
        } catch { toast("No se pudo guardar una copia local", 6000); return false; }
      }

      function emptyState_() { return {v: 5, notes: [], categories: [], settings: {}}; }
      function stateEqual_(a, b) { return makeSnapshot_(a?.categories, a?.notes) === makeSnapshot_(b?.categories, b?.notes); }
      function hasCloudChanges_() { return !baseState || !stateEqual_(serializeState(), baseState); }

      // La clave de una variante recuperada depende de su contenido: reintentar no la duplica.
      function recoveryId_(id, item) {
        const text = JSON.stringify(Object.keys(item).sort().map(k => [k, item[k]]));
        let hash = 14695981039346656037n;
        for (let i = 0; i < text.length; i++) hash = BigInt.asUintN(64, (hash ^ BigInt(text.charCodeAt(i))) * 1099511628211n);
        return id + "_rec_" + hash.toString(16);
      }
      function mergeLocalStates_(base, local, remote) {
        try { return mergeStates_(base, local, remote); } catch {}
        const result = cloneState_(remote);
        const equal = (a, b) => JSON.stringify(a && Object.keys(a).sort().map(k => [k, a[k]])) === JSON.stringify(b && Object.keys(b).sort().map(k => [k, b[k]]));
        for (const key of ["categories", "notes"]) {
          const before = new Map((base?.[key] || []).map(x => [x.id, x]));
          const ours = new Map((local[key] || []).map(x => [x.id, x]));
          const theirs = new Map((remote[key] || []).map(x => [x.id, x]));
          for (const id of new Set([...before.keys(), ...ours.keys()])) {
            const b = before.get(id), l = ours.get(id), r = theirs.get(id);
            if (equal(b, l)) continue;
            if (equal(b, r) || equal(l, r)) { if (l) theirs.set(id, l); else theirs.delete(id); continue; }
            // En una carrera edición/borrado se conserva el texto editado.
            if (!l) continue;
            if (!r) { theirs.set(id, l); continue; }
            if (key === "categories" && id === GENERAL_CATEGORY_ID) { theirs.set(id, {...r, ...l}); continue; }
            if (b) {
              const merged = {...r};
              let conflict = false;
              for (const field of new Set([...Object.keys(b), ...Object.keys(l)])) {
                if (JSON.stringify(b[field]) === JSON.stringify(l[field])) continue;
                if (JSON.stringify(b[field]) !== JSON.stringify(r[field]) && JSON.stringify(l[field]) !== JSON.stringify(r[field]) && field !== "updatedAt") conflict = true;
                merged[field] = field === "updatedAt" ? Math.max(l[field] || 0, r[field] || 0) : l[field];
              }
              if (!conflict) { theirs.set(id, merged); continue; }
            }
            const copy = {...l, id: recoveryId_(id, l)};
            if (key === "categories") copy.name = String(l.name) + " (recuperada)";
            theirs.set(copy.id, copy);
          }
          result[key] = [...theirs.values()];
        }
        // Una categoría borrada en otra pestaña no puede dejar notas sin categoría.
        const catIds = new Set(result.categories.map(c => c.id));
        for (const n of result.notes) {
          if (catIds.has(n.categoryId)) continue;
          const source = [...(local.categories || []), ...(base?.categories || [])].find(c => c.id === n.categoryId);
          if (source) { result.categories.push(cloneState_(source)); catIds.add(source.id); }
          else n.categoryId = GENERAL_CATEGORY_ID;
        }
        if (!catIds.has(GENERAL_CATEGORY_ID)) result.categories.unshift({...DEFAULT_GENERAL_CATEGORY});
        return result;
      }
      function openLocalDatabase_() {
        if (localDatabasePromise) return localDatabasePromise;
        localDatabasePromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error("IndexedDB no disponible")); return; }
          const request = window.indexedDB.open("notas_durable_v1", 1);
          request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains("state")) request.result.createObjectStore("state"); };
          request.onsuccess = () => {
            const db = request.result;
            db.onversionchange = () => { db.close(); localDatabasePromise = null; };
            resolve(db);
          };
          request.onerror = () => { localDatabasePromise = null; reject(request.error || new Error("No se pudo abrir el almacén local")); };
          request.onblocked = () => { localDatabasePromise = null; reject(new Error("Almacén local ocupado")); };
        });
        return localDatabasePromise;
      }
      async function readLocalRecord_() {
        const db = await openLocalDatabase_();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("state", "readonly");
          const request = tx.objectStore("state").get("current");
          tx.oncomplete = () => resolve(request.result || null);
          tx.onerror = tx.onabort = () => reject(tx.error || new Error("No se pudo leer el almacén local"));
        });
      }
      async function persistLocalRecord_(before, local, initialCloudBase, acknowledgedCloud) {
        const db = await openLocalDatabase_();
        return new Promise((resolve, reject) => {
          let tx;
          try { tx = db.transaction("state", "readwrite", {durability: "strict"}); }
          catch { tx = db.transaction("state", "readwrite"); }
          const store = tx.objectStore("state");
          const request = store.get("current");
          let output;
          request.onsuccess = () => {
            try {
              const previous = request.result;
              output = {
                state: mergeLocalStates_(before || emptyState_(), local, previous?.state || before || emptyState_()),
                cloudBase: acknowledgedCloud || previous?.cloudBase || initialCloudBase || null,
                version: (previous?.version || 0) + 1
              };
              store.put(output, "current");
            } catch (error) { reject(error); tx.abort(); }
          };
          tx.oncomplete = () => resolve(output);
          tx.onerror = tx.onabort = () => reject(tx.error || new Error("No se pudo guardar en el dispositivo"));
        });
      }
      function acknowledgeJournals_() {
        if (stagedPendingKey) localStorage.removeItem(stagedPendingKey);
        stagedPendingKey = null;
        for (const [key, raw] of adoptedPending) {
          const journal = safeParse(raw, null);
          if (journal?.journalId && key.endsWith(":snapshot:" + journal.journalId)) localStorage.removeItem(key);
          else localStorage.setItem(PENDING_ACK_KEY + key, raw);
        }
        adoptedPending.clear();
      }
      function adoptLocalModel_(next) {
        const current = serializeState();
        const changed = !stateEqual_(current, next);
        if (activeNoteId) {
          const old = current.notes.find(n => n.id === activeNoteId);
          const replacement = next.notes.find(n => n.id === activeNoteId);
          if (old && replacement && old.text !== replacement.text) {
            const copy = next.notes.find(n => n.id.startsWith(activeNoteId + "_rec_") && n.text === old.text);
            if (copy) activeNoteId = copy.id;
          }
        }
        notes = next.notes;
        categories = next.categories;
        ensureGeneralCategory();
        sanitizeNotesCategoryIds();
        if (activeNoteId) {
          const active = getNoteById(activeNoteId);
          if (active && noteEditorEl.value !== active.text) {
            const cursor = noteEditorEl.selectionStart || 0;
            noteEditorEl.value = active.text;
            noteEditorEl.selectionStart = noteEditorEl.selectionEnd = Math.min(cursor, active.text.length);
          }
        }
        lastSnapshot = makeSnapshot_(categories, notes);
        if (changed) {
          if (!noteDialogEl?.open && !catDialogEl?.open && !pointerDrag && !dragId) renderAll();
          else renderPending = true;
        }
      }
      async function refreshLocalState_() {
        if (localSavePromise || noteDialogEl?.open || catDialogEl?.open || pointerDrag || dragId) return;
        try {
          const record = await readLocalRecord_();
          if (!record) return;
          if (stateEqual_(record.state, localBaseState)) { baseState = record.cloudBase; return; }
          const current = cloneState_(serializeState());
          const next = mergeLocalStates_(localBaseState || emptyState_(), current, record.state);
          localBaseState = cloneState_(record.state);
          baseState = record.cloudBase;
          adoptLocalModel_(next);
          localRevision++;
          if (stateEqual_(next, record.state)) localSavedRevision = localRevision;
          else { stagePending_(); scheduleSaveDebounced_(); }
        } catch (error) { console.warn("No se pudo actualizar la copia local:", error); }
      }
      function initLocalNotifications_() {
        if (window.BroadcastChannel) {
          localChannel = new window.BroadcastChannel("notas_durable_changes_v1");
          localChannel.onmessage = () => { refreshLocalState_(); };
        }
        window.addEventListener("focus", () => { refreshLocalState_(); });
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshLocalState_(); });
      }
      function notifyLocal_() { try { localChannel?.postMessage({changed: true}); } catch {} }
      function cacheLocal_(record) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({...record.state, localOnly: true, cloudBase: record.cloudBase})); } catch {}
      }
      function flushPendingSave_() {
        if (localSavePromise) return localSavePromise;
        if (localRevision <= localSavedRevision) { flushCloudSave_(); return Promise.resolve(); }
        let saved = false;
        localSavePromise = (async () => {
          const revision = localRevision;
          const snapshot = cloneState_(serializeState());
          const record = await persistLocalRecord_(localBaseState || baseState || emptyState_(), snapshot, baseState, null);
          const next = mergeLocalStates_(snapshot, cloneState_(serializeState()), record.state);
          localBaseState = cloneState_(record.state);
          baseState = record.cloudBase;
          adoptLocalModel_(next);
          localSavedRevision = revision;
          saved = true;
          cacheLocal_(record);
          if (revision === localRevision) { try { acknowledgeJournals_(); } catch {} }
          else stagePending_();
          notifyLocal_();
        })().catch(error => {
          console.warn("Guardado local pendiente:", error);
          const staged = stagePending_();
          toast(staged ? "Guardado en la copia de recuperación de este dispositivo" : "No se pudo guardar: exporta tus notas antes de cerrar", 5000);
        }).finally(() => {
          localSavePromise = null;
          if (saved && localRevision > localSavedRevision) scheduleSaveDebounced_();
          if (saved) flushCloudSave_();
        });
        return localSavePromise;
      }
      function flushCloudSave_() {
        if (flushPromise) return flushPromise;
        if (!hasCloudChanges_() && baseState) return Promise.resolve();
        let cloudCommitted = false;
        flushPromise = (async () => {
          const revision = localRevision;
          const snapshot = cloneState_(serializeState());
          const before = cloneState_(baseState || emptyState_());
          const remote = await apiGetState_();
          validateRemote_(remote);
          // Un backend antiguo se puede leer, pero no sobrescribir sin revisión.
          const merged = mergeLocalStates_(before, snapshot, remote);
          let committed = cloneState_(remote);
          if (remote.revision && !stateEqual_(merged, remote)) {
            merged.baseRevision = remote.revision;
            await apiSaveAll_(merged);
            committed = cloneState_({...merged, revision: merged.savedRevision});
            delete committed.baseRevision;
            delete committed.savedRevision;
          } else if (!remote.revision) {
            if (stateEqual_(snapshot, merged) && stateEqual_(baseState, remote)) throw new Error("Sincronización remota sin control de versión");
            const localRecord = await persistLocalRecord_(snapshot, merged, baseState, remote);
            const next = mergeLocalStates_(snapshot, cloneState_(serializeState()), localRecord.state);
            localBaseState = cloneState_(localRecord.state);
            baseState = cloneState_(remote);
            adoptLocalModel_(next);
            cacheLocal_(localRecord);
            notifyLocal_();
            throw new Error("Sincronización remota sin control de versión");
          }
          const record = await persistLocalRecord_(snapshot, committed, before, committed);
          const next = mergeLocalStates_(snapshot, cloneState_(serializeState()), record.state);
          baseState = cloneState_(committed);
          localBaseState = cloneState_(record.state);
          adoptLocalModel_(next);
          if (revision === localRevision && stateEqual_(next, record.state)) localSavedRevision = revision;
          confirmedRevision = revision;
          cloudCommitted = true;
          cacheLocal_(record);
          notifyLocal_();
          if (hasCloudChanges_()) stagePending_();
          else { try { acknowledgeJournals_(); } catch {} }
        })().catch(error => {
          console.warn("Sincronización remota no disponible:", error);
          if (!cloudNoticeShown) {
            cloudNoticeShown = true;
            const backedUp = stagedPendingKey && safeStorageGet_(stagedPendingKey);
            toast(localRevision <= localSavedRevision ? "Notas guardadas en este dispositivo. Nube no disponible" :
              backedUp ? "Copia de recuperación guardada en este dispositivo. Nube no disponible" : "No se pudo confirmar el guardado: exporta tus notas", 5000);
          }
        }).finally(() => {
          flushPromise = null;
          if (cloudCommitted && hasCloudChanges_()) setTimeout(flushCloudSave_, 0);
        });
        return flushPromise;
      }

      const scheduleSaveDebounced_ = debounce(flushPendingSave_, 600);

      function saveDebounced() {
        localRevision++;
        stagePending_();
        scheduleSaveDebounced_();
      }

      function saveNow() {
        if (localRevision <= localSavedRevision) return;
        stagePending_();
        // Guardado inmediato por la misma cola, sin un segundo POST concurrente.
        if (!localSavePromise) flushPendingSave_();
      }

      function makeSnapshot_(cats, nts) {
        try {
          return JSON.stringify({
            categories: Array.isArray(cats) ? cats : [],
            notes: Array.isArray(nts) ? nts : []
          }, (key, value) => value && !Array.isArray(value) && typeof value === "object"
            ? Object.fromEntries(Object.keys(value).sort().map(k => [k, value[k]])) : value);
        } catch {
          return String(Date.now());
        }
      }

      function startAutoSync() {
        setInterval(async () => {
          const editing = !!(noteDialogEl?.open || catDialogEl?.open || pointerDrag || dragId || pendingPress);
          if (!editing && renderPending) { renderPending = false; renderAll(); }
          if (localRevision > localSavedRevision) { await flushPendingSave_(); return; }
          if (editing) return;
          await refreshLocalState_();
          await flushCloudSave_();
        }, AUTOSYNC_MS);
      }

      /* =========================
         Theme + Helpers
      ========================== */
      function applyTheme(theme) {
        let t = theme;
        if (theme === "auto") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      }

      function nextTheme(theme) { return theme === "auto" ? "dark" : theme === "dark" ? "light" : "auto"; }
      function themeLabel(theme) { return theme === "auto" ? "Auto" : theme === "dark" ? "Oscuro" : theme === "light" ? "Claro" : "Auto"; }

      function lastOrder(pinned, categoryId) {
        const group = notes
          .filter(n => !!n.pinned === !!pinned && (n.categoryId || GENERAL_CATEGORY_ID) === categoryId)
          .slice()
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        return group.length ? (group[group.length - 1].order ?? 0) : -1000;
      }

      function createNote({ afterId = null, pinned = false, categoryId = GENERAL_CATEGORY_ID }) {
        const now = Date.now();

        const group = notes
          .filter(n => !!n.pinned === !!pinned && (n.categoryId || GENERAL_CATEGORY_ID) === categoryId)
          .slice()
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

        let order = group.length ? (group[group.length - 1].order ?? 0) + 1000 : 0;

        if (afterId) {
          const idx = group.findIndex(n => n.id === afterId);
          if (idx !== -1) {
            const after = group[idx];
            const next = group[idx + 1];
            order = next ? (Number(after.order ?? 0) + Number(next.order ?? 0)) / 2 : Number(after.order ?? 0) + 1000;
          }
        }

        return {
          id: makeId(),
          text: "",
          createdAt: now,
          updatedAt: now,
          pinned: !!pinned,
          order,
          categoryId
        };
      }

      function renormalizeOrders(pinned, categoryId) {
        const group = notes
          .filter(n => !!n.pinned === !!pinned && (n.categoryId || GENERAL_CATEGORY_ID) === categoryId)
          .slice()
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

        for (let i = 0; i < group.length; i++) group[i].order = i * 1000;
      }

      function getNoteById(id) { return notes.find(n => n.id === id) || null; }

      function getSorter() {
        const mode = settings.sortMode;
        const sorters = {
          manual: (a, b) => (a.order ?? 0) - (b.order ?? 0),
          updated_desc: (a, b) => (b.updatedAt ?? 0) - (a.updatedAt ?? 0),
          created_desc: (a, b) => (b.createdAt ?? 0) - (a.createdAt ?? 0),
          alpha_asc: (a, b) => (a.text || "").localeCompare((b.text || ""), "es", { sensitivity: "base" })
        };
        return sorters[mode] || sorters.manual;
      }

      function groupNotesByCategory(list) {
        const map = new Map();
        for (const n of list) {
          const catId = n.categoryId || GENERAL_CATEGORY_ID;
          if (!map.has(catId)) map.set(catId, []);
          map.get(catId).push(n);
        }
        return map;
      }

      function getSortedNotesByCategory() {
        const sorter = getSorter();
        const pinned = notes.filter(n => !!n.pinned);
        const normal = notes.filter(n => !n.pinned);

        const pinnedByCat = groupNotesByCategory(pinned);
        const normalByCat = groupNotesByCategory(normal);

        for (const [k, arr] of pinnedByCat) pinnedByCat.set(k, arr.slice().sort(sorter));
        for (const [k, arr] of normalByCat) normalByCat.set(k, arr.slice().sort(sorter));

        return { pinnedByCat, normalByCat };
      }

      function buildCatGroupEl({ cat, pinned, notesInCat, showEmpty }) {
