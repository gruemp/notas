name: Verificar código de Notas
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/check.js
      - run: node --test tests/functional.js tests/reliability.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Repetir concurrencia entre pestañas
        run: |
          for attempt in 1 2 3 4 5; do
            node --test --test-timeout=45000 --test-name-pattern="actual IndexedDB|two tabs editing" tests/browser.test.js
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/

