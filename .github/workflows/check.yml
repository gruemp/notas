name: Verificar código de Notas
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/check.js
      - run: node --test tests/functional.js
